<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Dodge </title>
  <meta name="description" content="Play Neon Dodge, a fast neon arcade game from AA Games.">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('aa-theme') || 'dark';
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b14;
      --panel: #141827;
      --panel-2: #1a1f32;
      --text: #f4f5fb;
      --muted: #9da5ba;
      --line: rgba(255,255,255,.1);
      --accent: #f0ca52;
      --brand: #7774ed;
      --brand-strong: #8c89f5;
      --danger: #f05278;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f5f6fb;
      --panel: #fff;
      --panel-2: #eef0f8;
      --text: #151726;
      --muted: #697086;
      --line: rgba(21,23,38,.12);
      --accent: #b3830e;
      --brand: #5753ca;
      --brand-strong: #4541b5;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 50% 0%, rgba(119,116,237,.24), transparent 34rem), var(--bg);
      color: var(--text);
      font: 16px/1.6 'DM Sans', system-ui, sans-serif;
      transition: background .2s ease, color .2s ease;
    }
    a { color: inherit; }
    button { font: inherit; }
    .site-header { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(16px); }
    .nav { width: min(1180px, calc(100% - 40px)); min-height: 70px; margin: auto; display: flex; align-items: center; gap: 24px; }
    .logo { display: inline-flex; align-items: center; text-decoration: none; }
    .logo img { width: 166px; height: auto; filter: invert(1); opacity: .96; }
    [data-theme="light"] .logo img { filter: none; }
    .nav-links { display: flex; gap: 6px; margin-left: auto; }
    .nav-links a, .theme-toggle { border: 1px solid transparent; border-radius: 10px; padding: 8px 13px; color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none; }
    .nav-links a:hover, .nav-links a[aria-current="page"], .theme-toggle:hover { border-color: var(--line); background: var(--panel-2); color: var(--text); }
    .theme-toggle { width: 42px; height: 42px; padding: 0; border-color: var(--line); background: var(--panel); color: var(--text); cursor: pointer; }

    .page { width: min(900px, calc(100% - 40px)); margin: auto; padding: 54px 0 70px; text-align: center; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-family: 'Orbitron', system-ui, sans-serif; font-size: clamp(36px, 7vw, 62px); letter-spacing: -.06em; line-height: 1.08; }
    .intro { max-width: 570px; margin: 14px auto 28px; color: var(--muted); font-size: 17px; }
    .game-card { overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: #05060d; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 1.6; touch-action: none; }
    .hud { display: flex; justify-content: space-between; gap: 16px; padding: 14px 20px; background: var(--panel); color: var(--muted); font-weight: 700; }
    .hud b { color: var(--accent); font-variant-numeric: tabular-nums; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .button { border: 1px solid transparent; border-radius: 12px; padding: 11px 18px; background: var(--brand); color: #fff; font-weight: 800; text-decoration: none; cursor: pointer; transition: transform .15s ease, background .15s ease; }
    .button:hover { background: var(--brand-strong); transform: translateY(-2px); }
    .button.secondary { border-color: var(--line); background: var(--panel); color: var(--text); }
    .touch-controls { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
    .touch-controls button { width: 76px; height: 50px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); color: var(--text); font-size: 22px; cursor: pointer; touch-action: none; user-select: none; }
    .help { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
    .tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 30px; text-align: left; }
    .tip { border: 1px solid var(--line); border-radius: 15px; background: color-mix(in srgb, var(--panel) 82%, transparent); padding: 16px; }
    .tip strong { display: block; margin-bottom: 3px; color: var(--text); }
    .tip span { color: var(--muted); font-size: 13px; }
    .site-footer { border-top: 1px solid var(--line); padding: 24px 20px; color: var(--muted); text-align: center; font-size: 13px; }
    @media (max-width: 650px) {
      .nav, .page { width: min(100% - 28px, 900px); }
      .nav { min-height: 62px; gap: 10px; }
      .logo img { width: 140px; }
      .nav-links { display: none; }
      .theme-toggle { margin-left: auto; }
      .page { padding-top: 38px; }
      .tips { grid-template-columns: 1fr; text-align: center; }
    }
    @media (min-width: 700px) { .touch-controls { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>


  <main class="page">

    <section class="game-card" aria-label="Neon Dodge game">
      <canvas id="canvas" width="960" height="600" aria-label="Neon Dodge game board"></canvas>
      <div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
    </section>
    <div class="actions"><button class="button" id="start" type="button">Start game</button><a class="button secondary" href="./index.html">Back to library</a></div>
    <div class="touch-controls" aria-label="Touch controls"><button id="left" type="button" aria-label="Move left">←</button><button id="right" type="button" aria-label="Move right">→</button></div>
  </main>
  
  <script>
    const canvas = document.querySelector('#canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const bestEl = document.querySelector('#best');
    const start = document.querySelector('#start');
    const keys = new Set();
    let player, blocks = [], particles = [], score = 0, running = false, lastTime = 0, spawnTimer = 0, animationFrame = 0;
    let best = Number(localStorage.getItem('neon-dodge-best') || 0);
    bestEl.textContent = best;
    document.querySelector('#year').textContent = new Date().getFullYear();

    addEventListener('keydown', event => {
      if (['ArrowLeft','ArrowRight','a','d','A','D',' '].includes(event.key)) {
        keys.add(event.key); event.preventDefault();
        if (event.key === ' ' && !running) startGame();
      }
    });
    addEventListener('keyup', event => keys.delete(event.key));

    function startGame() {
      player = { x: canvas.width / 2 - 24, y: canvas.height - 70, w: 48, h: 24, speed: 8 };
      blocks = []; particles = []; score = 0; spawnTimer = 0; lastTime = performance.now(); running = true;
      start.textContent = 'Restart game'; cancelAnimationFrame(animationFrame); animationFrame = requestAnimationFrame(gameLoop);
    }
    function spawnBlock() {
      const size = 24 + Math.random() * 34;
      blocks.push({ x: Math.random() * (canvas.width - size), y: -size, w: size, h: size, speed: 3 + score / 500 + Math.random() * 2 });
    }
    function gameLoop(now) {
      if (!running) return;
      const delta = Math.min((now - lastTime) / 16.67, 2); lastTime = now; spawnTimer -= delta;
      if (spawnTimer <= 0) { spawnBlock(); spawnTimer = Math.max(14, 42 - score / 25); }
      if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) player.x -= player.speed * delta;
      if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) player.x += player.speed * delta;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
      blocks.forEach(block => { block.y += block.speed * delta; if (block.y > canvas.height) createParticles(block.x + block.w / 2, canvas.height - 8, '#f05278', 2); });
      blocks = blocks.filter(block => block.y < canvas.height + 60);
      particles.forEach(p => { p.x += p.vx * delta; p.y += p.vy * delta; p.life -= .025 * delta; }); particles = particles.filter(p => p.life > 0);
      score += delta * .18;
      if (blocks.some(block => collides(block, player))) { createParticles(player.x + player.w / 2, player.y + player.h / 2, '#8c89f5', 24); gameOver(); return; }
      draw(); animationFrame = requestAnimationFrame(gameLoop);
    }
    function collides(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
    function createParticles(x, y, color, count) { for (let i = 0; i < count; i++) { const angle = Math.random() * Math.PI * 2, speed = 1 + Math.random() * 4; particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, color }); } }
    function draw() {
      ctx.fillStyle = '#05060d'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#ffffff0c'; ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
      ctx.shadowBlur = 18; ctx.shadowColor = '#8c89f5'; ctx.fillStyle = '#8c89f5'; ctx.fillRect(player.x, player.y, player.w, player.h);
      blocks.forEach(block => { ctx.shadowColor = '#f05278'; ctx.fillStyle = '#f05278'; ctx.fillRect(block.x, block.y, block.w, block.h); });
      particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); }); ctx.globalAlpha = 1; ctx.shadowBlur = 0; scoreEl.textContent = Math.floor(score);
    }
    function gameOver() {
      running = false; cancelAnimationFrame(animationFrame); const finalScore = Math.floor(score);
      if (finalScore > best) { best = finalScore; localStorage.setItem('neon-dodge-best', best); bestEl.textContent = best; }
      draw(); ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '700 42px system-ui'; ctx.fillText('Game over', canvas.width / 2, canvas.height / 2 - 10); ctx.font = '20px system-ui'; ctx.fillText(`Score: ${finalScore} — press Start to try again`, canvas.width / 2, canvas.height / 2 + 30);
    }
    function hold(button, key) { const press = event => { event.preventDefault(); keys.add(key); }, release = event => { event.preventDefault(); keys.delete(key); }; button.addEventListener('pointerdown', press); ['pointerup','pointerleave','pointercancel'].forEach(type => button.addEventListener(type, release)); }
    start.addEventListener('click', startGame); hold(document.querySelector('#left'), 'ArrowLeft'); hold(document.querySelector('#right'), 'ArrowRight');
    const themeToggle = document.querySelector('#themeToggle');
    themeToggle.addEventListener('click', () => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; localStorage.setItem('aa-theme', next); themeToggle.textContent = next === 'dark' ? '☼' : '☾'; });
    player = { x: canvas.width / 2 - 24, y: canvas.height - 70, w: 48, h: 24, speed: 8 }; draw();
  </script>
</body>
</html>
